name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    # Every other job installs the newest of everything, so a constraint that
    # claims more than it can deliver never gets tested. This one resolves the
    # floor and runs against it. It matters more here than in a package with no
    # dependencies: "psr/log": "^1.0|^2.0|^3.0" is claimed because XenForo 2.3
    # ships psr/log 1.1.4 and its autoloader wins over an add-on's private
    # vendor tree. This job is what stops that claim quietly becoming false.
    #
    # Pint is deliberately not run here. It is a formatter whose rule set moves
    # between patches, so the oldest Pint could reject code the newest accepts,
    # which is churn rather than a defect.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - run: vendor/bin/phpunit

      - run: vendor/bin/phpstan analyse --no-progress

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      # Runs once rather than per version: phpstan.neon analyses the whole
      # 8.3 - 8.5 range in a single pass, whatever PHP it runs on.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    # Two checks against one --no-dev install, because a class used but never
    # declared works on this machine and fatals for the consumer: something
    # else is supplying it here. Nothing else in this workflow catches that -
    # the other jobs all install the full dev tree, so everything resolves.
    #
    # They overlap without replacing each other. composer-require-checker
    # collects symbol names and takes its known set from "require", so it sees
    # both a dev dependency leaking into src/ and a TRANSITIVE one - a package
    # that survives --no-dev today and disappears at its supplier's next major.
    # It is also the only check that names an undeclared ext-*, since PHPStan
    # knows those functions from its own stubs and the suite passes because the
    # runner has them.
    #
    # PHPStan reads the code instead, so it says WHERE in src/ the symbol is
    # reached and covers functions and constants alongside classes. It is blind
    # to the transitive case by construction. It also skips the body of any
    # trait no analysed class uses, which would make this step pass
    # unconditionally on a package whose src/ is traits - src/ here is 50 files
    # and none of them are traits, and the step was confirmed able to fail by
    # planting a require-dev-only class in src/ and watching it get reported.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none
          # Both are dev dependencies that the install below deletes, and both
          # have to run from outside the package. For PHPStan that is
          # load-bearing rather than tidy: run from inside any vendor tree and
          # it lends the analysed code that tree's dependencies, then passes on
          # exactly the class it was meant to catch. setup-php puts these
          # outside every vendor tree by construction.
          tools: phpstan, composer-require-checker

      - run: composer install --no-dev --prefer-dist --no-progress

      # Proof the strip actually happened. PHPStan discovers symbols from
      # vendor/composer/installed.json rather than from the autoloader alone,
      # so "composer dump-autoload --no-dev" is not a shortcut - the packages
      # have to be gone, not just unregistered.
      - run: ls vendor/

      # A separate config from phpstan.neon, which analyses tests/ - that
      # cannot resolve PHPUnit once --no-dev has run, and the failure reads as
      # a dependency finding rather than the configuration error it is.
      - run: >
          phpstan analyse -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

      - run: composer-require-checker check composer.json
