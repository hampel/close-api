name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    # Every other job installs the newest of everything, so a constraint that
    # claims more than it can deliver never gets tested. This one resolves the
    # floor and runs against it. It matters more here than in a package with no
    # dependencies: "psr/log": "^1.0|^2.0|^3.0" is claimed because XenForo 2.3
    # ships psr/log 1.1.4 and its autoloader wins over an add-on's private
    # vendor tree. This job is what stops that claim quietly becoming false.
    #
    # Pint is deliberately not run here. It is a formatter whose rule set moves
    # between patches, so the oldest Pint could reject code the newest accepts,
    # which is churn rather than a defect.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - run: vendor/bin/phpunit

      - run: vendor/bin/phpstan analyse --no-progress

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      # Runs once rather than per version: phpstan.neon analyses the whole
      # 8.3 - 8.5 range in a single pass, whatever PHP it runs on.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    # Reads src/ against a --no-dev install and reports any symbol that no
    # declared dependency provides. This package has real dependencies and a
    # deliberately minimal set of them - PSR interfaces and discovery, no
    # concrete HTTP client - so this job is what stops a convenience reference
    # to Guzzle, Nyholm or a test-only helper leaking into src/ and turning an
    # optional suggestion into an undeclared requirement.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      - run: composer install --no-dev --prefer-dist --no-progress

      # Installed outside the package so that the checker's own dependencies
      # cannot land in the tree being checked. "composer -d" does not create the
      # directory: without the mkdir the step dies with "Invalid working
      # directory specified".
      - run: |
          mkdir -p /tmp/crc
          composer -d /tmp/crc require maglnet/composer-require-checker:^4.20 --no-progress

      - run: /tmp/crc/vendor/bin/composer-require-checker check composer.json
